<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Surprise 🎉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0f1c;--fg:#e9f2ff}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--fg);
      background: radial-gradient(1400px 700px at 60% -10%, #26376b 0%, #0a0f1c 60%);
      overflow:hidden;
    }
    .center{
      position:relative; display:grid; place-items:center; height:100%;
      text-align:center; padding:24px;
    }
    h1{
      font-size: clamp(28px, 6vw, 60px);
      margin:0 0 6px 0;
      letter-spacing:.3px;
      text-shadow: 0 6px 40px rgba(0,0,0,.45);
    }
    p{margin:4px 0 0 0; opacity:.9}
    .stats{margin-top:10px; font-weight:700; opacity:.9}
    .btns{margin-top:18px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
    .btn{
      background:#1d2a46;border:1px solid #2b3a5c;color:#d9e8ff;
      padding:12px 16px;border-radius:12px;font-weight:800;letter-spacing:.2px;cursor:pointer;text-decoration:none
    }
    canvas{position:fixed;inset:0;pointer-events:none}
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="center">
    <div>
      <h1>You're going to be an Aunty! 🎉</h1>
      <p>We’re so excited to share this with you.</p>
      <div class="stats" id="stats"></div>
      <div class="btns">
        <a class="btn" href="index.html">Play again</a>
      </div>
    </div>
  </div>

  <script>
    // Read stats from query params
    const p = new URLSearchParams(location.search);
    const secs = parseInt(p.get('time')||'0',10);
    const moves = parseInt(p.get('moves')||'0',10);
    if(secs>0 || moves>0){
      const mm = String(Math.floor(secs/60)).padStart(2,'0');
      const ss = String(secs%60).padStart(2,'0');
      document.getElementById('stats').textContent = `Time: ${mm}:${ss}   •   Moves: ${moves}`;
    }

    // Tiny confetti
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let w, h, pieces;

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      pieces = Array.from({length: 180}, () => ({
        x: Math.random()*w,
        y: Math.random()*-h,
        s: 4 + Math.random()*6,
        a: Math.random()*Math.PI*2,
        v: 2 + Math.random()*3,
        r: Math.random()*Math.PI,
        spin: (Math.random()-.5)*0.2
      }));
    }
    window.addEventListener('resize', resize);
    resize();

    function tick(){
      ctx.clearRect(0,0,w,h);
      for(const p of pieces){
        p.y += p.v;
        p.x += Math.sin(p.a) * 1.2;
        p.r += p.spin;
        if(p.y > h+20){ p.y = -10; p.x = Math.random()*w; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = `hsl(${(p.x/w)*360}, 85%, 65%)`;
        ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);
        ctx.restore();
      }
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
